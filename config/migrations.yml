services:
    _defaults:
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ["setFramework", ["@contao.framework"]]

    janborg.h4atabellen.migration.h4aseasons:
        class: Janborg\H4aTabellen\Migration\H4aSeasonsMigration
        arguments:
            - "@database_connection"
            - "@contao.framework"
            - "@h4atabellen.h4aapihelper"

    janborg.h4atabellen.migration.mcvtocgw:
        class: Janborg\H4aTabellen\Migration\MultiColumnWizardToContaoGroupWidgetWMigration
        arguments:
            - "@database_connection"

    janborg.h4atabellen.migration.hnteams:
        class: Janborg\H4aTabellen\Migration\HandballnetTeamsListModeMigration
        arguments:
            - "@database_connection"
            - "@contao.framework"