services:
    _defaults:
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - ["setFramework", ["@contao.framework"]]

    janborg.h4atabellen.migration.mcvtocgw:
        class: Janborg\H4aTabellen\Migration\MultiColumnWizardToContaoGroupWidgetMigration
        arguments:
            - "@database_connection"

    janborg.h4atabellen.migration.hnteams:
        class: Janborg\H4aTabellen\Migration\HandballnetTeamsListModeMigration
        arguments:
            - "@database_connection"
            - "@contao.framework"

    janborg.h4atabellen.migration.fillhandballnetidincalendarevents:
        class: Janborg\H4aTabellen\Migration\FillHandballnetIdInCalendarEventMigration
        arguments:
            - "@database_connection"

    janborg.h4atabellen.migration.fillhandballnetidincalendar:
        class: Janborg\H4aTabellen\Migration\FillHandballnetIdInCalendarsMigration
        arguments:
            - "@database_connection"

    janborg.h4atabellen.migration.fillhandballnetteamidinteams:
        class: Janborg\H4aTabellen\Migration\FillHandballnetTeamIdInHandballnetTeamsMigration
        arguments:
            - "@database_connection"

    janborg.h4atabellen.migration.fillliganameincalendars:
        class: Janborg\H4aTabellen\Migration\FillLiganameInCalendarsMigration
        arguments:
            - "@database_connection"
