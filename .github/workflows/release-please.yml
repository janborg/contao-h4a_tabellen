on:
    push:
        branches:
            - 4.x
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

name: release-please

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v4
              id: release-please-action
              with:
                  release-type: php
                  target-branch: 4.x
                  manifest-file: .github/.release-please-manifest.json
                  token: ${{ secrets.GITHUB_TOKEN }}