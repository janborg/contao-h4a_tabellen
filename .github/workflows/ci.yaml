name: CI

on:
  pull_request: ~
  push:
    branches:
      - '*.x'

jobs:
  ecs:
    name: ecs
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the dependencies
        run: |
          composer install --no-interaction --no-progress
          composer dump-autoload --optimize

      - name: Check the coding style
        run: vendor/bin/ecs check src tests --config ecs.php --ansi --no-progress-bar

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the dependencies
        run: composer install --no-interaction --no-suggest

      - name: Analyze the code
        run: vendor/bin/phpstan analyse src tests --configuration phpstan.neon --no-progress --ansi

  depcheck:
    name: depcheck
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the dependencies
        run: composer install --no-interaction --no-suggest

      - name: Check the dependencies
        run: vendor/bin/composer-dependency-analyser --config=composer-dependency-analyser.php

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the dependencies
        run: composer install --no-interaction --no-suggest

      - name: Run the unit tests
        run: vendor/bin/phpunit --colors=always
