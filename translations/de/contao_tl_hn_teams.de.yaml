tl_hn_teams:

    # Global operations

    # Operations
    edit: Team %s bearbeiten
    delete: Team %s löschen
    show: Team %s - Daten anzeigen
    toggle: 
      0: Automatische Updates für Team %s aktivieren/deaktivieren
      1: Automatische Updates für Team %s Team deaktivieren
      2: Automatische Updates für Team %s Team aktivieren
      3: Team Updates deaktivieren
      4: Teams Updates aktivieren 

    # Legends
    title_legend: Handball.net Team Einstellungen 
    status_legend: Status Einstellungen
    handballnet_tournament_legend: Handballnet Liga Daten
    handballnet_team_legend: Handballnet Team Daten

    # Fields
    saison: 
      0: Saison (handball.net)
      1: Jahr der Saison auf handball.net (2024 für 2024/2025)

    handballnet_team_id:
      0: Team ID
      1: ID des Teams bei Handball.net 

    handballnet_tournament_id:
      0: Tournament ID
      1: ID der Liga beim Handball.net

    liga_shortname:
      0: Liga Short Name
      1: Kurzbezeichnug der Liga bei handball.net (z.Bsp. "m-bol_hf")

    liga_name:
      0: Name der Liga
      1: Bezeichnung der Liga, wird bei Update nicht überschrieben

    provider:
      0: Provider
      1: Provider der Daten (z.Bsp. "handball4all")

    verband:
      0: Verband
      1: Verband des Clubs (z.Bsp. "Badischer Handballverband")
    
    is_active:
      0: Aktives Team
      1: Team wird beim automatischen Update berücksichtigt

    my_team_name:
      0: Mein Team
      1: Name des Teams, um es per css hervorzuheben