tl_h4a_seasons:
  title_legend: Season Settings
  
  season:
    0: Season
    1: Description of the season, i.e. "2019/2020"
  
  is_current_season:
    0: Current Season
    1: Check, if this is the current season
  
  h4a_ignore:
    0: Ignore
    1: Season will not be automatically updated via cronjob
  
  toggle_ignore: Ignore season for automatic updates
